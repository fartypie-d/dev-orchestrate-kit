<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" role="img"
           aria-label="Delegation sequence for standard·large tasks. Main claude writes a prompt file and runs a background delegation via run-delegation.sh, and an opencode agent implements with TDD. On completion, main hands the task file and log path to the task-orchestrator subagent, which checks the log &amp; TDD, runs domain verification, and makes a local commit before reporting. Main calls domain reviewers in parallel to judge, and re-delegates at heavy tier if rejected."><style>
svg { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: #93A0AC; }
.lane-h { font-size: 13px; font-weight: 700; fill: #E5EAEF; letter-spacing: 0.02em; }
.lane-g { stroke: currentColor; stroke-dasharray: 3 6; opacity: 0.28; }
.bx { fill: #1A212A; stroke: #2D3743; stroke-width: 1.2; }
.bx-bar { fill: #56C2D4; }
.bx-t { font-size: 14px; font-weight: 650; fill: #E5EAEF; }
.bx-s { font-size: 11px; fill: #93A0AC; }
.gate-bx { fill: #2B2313; stroke: #E0A94E; stroke-width: 1.3; }
.gate-t { font-size: 14px; font-weight: 700; fill: #E0A94E; }
.pill { fill: #222B35; stroke: #2D3743; stroke-width: 1; }
.oc-bx { fill: #1A212A; stroke: #56C2D4; stroke-width: 1.5; }
.opt-bx { fill: none; stroke: #2D3743; stroke-width: 1.2; stroke-dasharray: 5 4; }
.fl { stroke: currentColor; stroke-width: 1.4; fill: none; }
.fl-a { stroke: #56C2D4; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.lbl { font-size: 11px; fill: #93A0AC; }
.lbl-a { font-size: 11px; fill: #56C2D4; font-weight: 600; }
.note-t { font-size: 11.5px; font-weight: 700; fill: #E5EAEF; }
.note-l { font-size: 11px; fill: #93A0AC; }
.mono-t { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.chip { fill: #1A212A; stroke: #2D3743; stroke-width: 1; }
.chip-g { fill: #2B2313; stroke: #E0A94E; stroke-width: 1.2; }
.chip-h { fill: #16333A; stroke: #56C2D4; stroke-width: 1.2; stroke-dasharray: 4 3; }
.chip-t { font-size: 11.5px; font-weight: 600; fill: #E5EAEF; }
.sess-bx { fill: #12171E; stroke: #2D3743; stroke-width: 1.2; }
.sess-t { font-size: 12px; font-weight: 700; fill: #E5EAEF; }
.fl-b { stroke: currentColor; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; opacity: 0.7; }
</style><rect width="100%" height="100%" fill="#1A212A"/>
        <defs>
          <marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
          <marker id="ah4-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#56C2D4"/>
          </marker>
        </defs>

        <!-- lifelines -->
        <line class="lane-g" x1="150" y1="76" x2="150" y2="452"/>
        <line class="lane-g" x1="450" y1="76" x2="450" y2="452"/>
        <line class="lane-g" x1="740" y1="76" x2="740" y2="452"/>

        <!-- actors -->
        <rect class="bx" x="60" y="20" width="180" height="52" rx="9"/>
        <text class="bx-t" x="150" y="41" text-anchor="middle">main claude</text>
        <text class="bx-s" x="150" y="60" text-anchor="middle">owns delegation &amp; review</text>
        <rect class="bx" x="360" y="20" width="180" height="52" rx="9"/>
        <text class="bx-t" x="450" y="41" text-anchor="middle">opencode agent</text>
        <text class="bx-s" x="450" y="60" text-anchor="middle">via run-delegation.sh</text>
        <rect class="bx" x="650" y="20" width="180" height="52" rx="9"/>
        <text class="bx-t" x="740" y="41" text-anchor="middle">task-orchestrator</text>
        <text class="bx-s" x="740" y="60" text-anchor="middle">claude subagent</text>

        <!-- messages -->
        <text class="lbl" x="300" y="100" text-anchor="middle">① write task&lt;N&gt;.prompt → run background delegation</text>
        <line class="fl" x1="150" y1="112" x2="446" y2="112" marker-end="url(#ah4)"/>

        <rect class="oc-bx" x="365" y="130" width="170" height="44" rx="8"/>
        <text class="bx-t" x="450" y="148" text-anchor="middle" style="font-size:12.5px">TDD implementation</text>
        <text class="bx-s" x="450" y="165" text-anchor="middle">model fallback · global lock</text>

        <text class="lbl" x="300" y="193" text-anchor="middle">② completion notice — task&lt;N&gt;.log · MODEL_USED= · exit</text>
        <line class="fl" x1="450" y1="204" x2="154" y2="204" marker-end="url(#ah4)"/>

        <text class="lbl" x="445" y="229" text-anchor="middle">③ pass only task file + propagation constraints + log path (no full brief)</text>
        <line class="fl" x1="150" y1="240" x2="646" y2="240" marker-end="url(#ah4)"/>

        <rect class="bx" x="628" y="258" width="224" height="56" rx="8"/>
        <text class="bx-s" x="740" y="280" text-anchor="middle" style="fill: #E5EAEF; font-weight: 600">④ check log · boundaries · TDD</text>
        <text class="bx-s" x="740" y="298" text-anchor="middle" style="fill: #E5EAEF; font-weight: 600">domain verify → local commit</text>

        <text class="lbl" x="445" y="335" text-anchor="middle">⑤ report — commit hash · verify result · propagation constraints (on failure: "re-delegate needed" + fix.prompt)</text>
        <line class="fl" x1="740" y1="346" x2="154" y2="346" marker-end="url(#ah4)"/>

        <rect class="bx" x="62" y="364" width="176" height="44" rx="8"/>
        <text class="bx-s" x="150" y="382" text-anchor="middle" style="fill: #E5EAEF; font-weight: 600">⑥ domain reviewers</text>
        <text class="bx-s" x="150" y="399" text-anchor="middle">parallel call → verdict</text>

        <text class="lbl-a" x="300" y="425" text-anchor="middle">⑦ rejection · verify failure → re-delegate at heavy tier (same task, max 2×)</text>
        <line class="fl-a" x1="150" y1="436" x2="446" y2="436" marker-end="url(#ah4-a)"/>

        <text class="lbl" x="450" y="478" text-anchor="middle">verdict pass → repeat from ① for next task · when the planned part ends, HANDOFF then new session (§02)</text>
      </svg>