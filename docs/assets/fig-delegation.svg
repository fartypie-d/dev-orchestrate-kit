<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" role="img"
           aria-label="standard·large task의 위임 시퀀스. 메인 claude가 프롬프트 파일을 쓰고 run-delegation.sh로 백그라운드 위임을 실행하면 opencode 에이전트가 TDD로 구현한다. 완료 후 메인이 task-orchestrator 서브에이전트에 task 파일과 로그 경로를 전달하고, 서브가 로그·TDD 확인, 도메인 검증, 로컬 커밋까지 수행해 보고한다. 메인이 도메인 리뷰어를 병렬 호출해 판정하고, 반려 시 heavy 티어로 재위임한다."><style>
svg { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: #5D6873; }
.lane-h { font-size: 13px; font-weight: 700; fill: #212831; letter-spacing: 0.02em; }
.lane-g { stroke: currentColor; stroke-dasharray: 3 6; opacity: 0.28; }
.bx { fill: #FFFFFF; stroke: #D7DDE3; stroke-width: 1.2; }
