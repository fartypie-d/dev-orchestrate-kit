        <!-- messages -->
        <text class="lbl" x="300" y="100" text-anchor="middle">① task&lt;N&gt;.prompt 작성 → 백그라운드 위임 실행</text>
        <line class="fl" x1="150" y1="112" x2="446" y2="112" marker-end="url(#ah4)"/>

        <rect class="oc-bx" x="365" y="130" width="170" height="44" rx="8"/>
        <text class="bx-t" x="450" y="148" text-anchor="middle" style="font-size:12.5px">TDD 구현</text>
