        <text class="lbl" x="445" y="229" text-anchor="middle">③ task 파일 + 전파 제약 + 로그 경로만 전달 (전체 지시서 금지)</text>
        <line class="fl" x1="150" y1="240" x2="646" y2="240" marker-end="url(#ah4)"/>

        <rect class="bx" x="628" y="258" width="224" height="56" rx="8"/>
        <text class="bx-s" x="740" y="280" text-anchor="middle" style="fill: #212831; font-weight: 600">④ 로그·경계·TDD 확인</text>
        <text class="bx-s" x="740" y="298" text-anchor="middle" style="fill: #212831; font-weight: 600">도메인 검증 → 로컬 커밋</text>

        <text class="lbl" x="445" y="335" text-anchor="middle">⑤ 보고 — 커밋 해시·검증 결과·전파 제약 (실패 시 "재위임 필요" + fix.prompt)</text>
        <line class="fl" x1="740" y1="346" x2="154" y2="346" marker-end="url(#ah4)"/>

        <rect class="bx" x="62" y="364" width="176" height="44" rx="8"/>
        <text class="bx-s" x="150" y="382" text-anchor="middle" style="fill: #212831; font-weight: 600">⑥ 도메인 리뷰어</text>
        <text class="bx-s" x="150" y="399" text-anchor="middle">병렬 호출 → 판정</text>

        <text class="lbl-a" x="300" y="425" text-anchor="middle">⑦ 반려·검증 실패 → heavy 승격 재위임 (동일 task 최대 2회)</text>
        <line class="fl-a" x1="150" y1="436" x2="446" y2="436" marker-end="url(#ah4-a)"/>

        <text class="lbl" x="450" y="478" text-anchor="middle">판정 pass → 다음 task로 ①부터 반복 · 계획된 파트가 끝나면 HANDOFF 후 새 세션 (§02)</text>
      </svg>