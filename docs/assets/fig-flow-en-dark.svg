<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" role="img"
           aria-label="Workflow drawn as three lanes: user, Claude orchestrator, and opencode implementation runner. The user's natural-language request goes through interview, size classification, and GATE 1 approval, then is delegated to an opencode agent via run-delegation.sh, followed by domain review (re-delegated at heavy tier if rejected), GATE 2 integration approval, ending with report and phase-close."><style>
svg { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: #93A0AC; }
.lane-h { font-size: 13px; font-weight: 700; fill: #E5EAEF; letter-spacing: 0.02em; }
.lane-g { stroke: currentColor; stroke-dasharray: 3 6; opacity: 0.28; }
.bx { fill: #1A212A; stroke: #2D3743; stroke-width: 1.2; }
.bx-bar { fill: #56C2D4; }
.bx-t { font-size: 14px; font-weight: 650; fill: #E5EAEF; }
.bx-s { font-size: 11px; fill: #93A0AC; }
.gate-bx { fill: #2B2313; stroke: #E0A94E; stroke-width: 1.3; }
.gate-t { font-size: 14px; font-weight: 700; fill: #E0A94E; }
.pill { fill: #222B35; stroke: #2D3743; stroke-width: 1; }
.oc-bx { fill: #1A212A; stroke: #56C2D4; stroke-width: 1.5; }
.opt-bx { fill: none; stroke: #2D3743; stroke-width: 1.2; stroke-dasharray: 5 4; }
.fl { stroke: currentColor; stroke-width: 1.4; fill: none; }
.fl-a { stroke: #56C2D4; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.lbl { font-size: 11px; fill: #93A0AC; }
.lbl-a { font-size: 11px; fill: #56C2D4; font-weight: 600; }
.note-t { font-size: 11.5px; font-weight: 700; fill: #E5EAEF; }
.note-l { font-size: 11px; fill: #93A0AC; }
.mono-t { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.chip { fill: #1A212A; stroke: #2D3743; stroke-width: 1; }
.chip-g { fill: #2B2313; stroke: #E0A94E; stroke-width: 1.2; }
.chip-h { fill: #16333A; stroke: #56C2D4; stroke-width: 1.2; stroke-dasharray: 4 3; }
.chip-t { font-size: 11.5px; font-weight: 600; fill: #E5EAEF; }
.sess-bx { fill: #12171E; stroke: #2D3743; stroke-width: 1.2; }
.sess-t { font-size: 12px; font-weight: 700; fill: #E5EAEF; }
.fl-b { stroke: currentColor; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; opacity: 0.7; }
</style><rect width="100%" height="100%" fill="#1A212A"/>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
          <marker id="ah-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#56C2D4"/>
          </marker>
        </defs>

        <!-- lane headers -->
        <text class="lane-h" x="150" y="34" text-anchor="middle">User</text>
        <text class="lane-h" x="480" y="34" text-anchor="middle">Supervisor harness — orchestrator</text>
        <text class="lane-h" x="810" y="34" text-anchor="middle">opencode — implementation runner</text>

        <!-- lane guides -->
        <line class="lane-g" x1="150" y1="52" x2="150" y2="944"/>
        <line class="lane-g" x1="480" y1="52" x2="480" y2="944"/>
        <line class="lane-g" x1="810" y1="52" x2="810" y2="944"/>

        <!-- ===== claude spine ===== -->
        <!-- S1 -->
        <rect class="bx" x="360" y="72" width="240" height="58" rx="9"/>
        <rect class="bx-bar" x="360" y="86" width="3" height="30"/>
        <text class="bx-t" x="480" y="96" text-anchor="middle">Receive request</text>
        <text class="bx-s" x="480" y="115" text-anchor="middle">Load /orchestrate global skill</text>
        <!-- S2 -->
        <rect class="bx" x="360" y="160" width="240" height="58" rx="9"/>
        <rect class="bx-bar" x="360" y="174" width="3" height="30"/>
        <text class="bx-t" x="480" y="184" text-anchor="middle">Interview</text>
        <text class="bx-s" x="480" y="203" text-anchor="middle">Clarify ambiguities &amp; risks as choices</text>
        <!-- S3 -->
        <rect class="bx" x="360" y="248" width="240" height="58" rx="9"/>
        <rect class="bx-bar" x="360" y="262" width="3" height="30"/>
        <text class="bx-t" x="480" y="272" text-anchor="middle">Classify size · write brief</text>
        <text class="bx-s" x="480" y="291" text-anchor="middle">small / standard / large — split into .tasks/</text>
        <!-- S4 GATE1 -->
        <rect class="gate-bx" x="360" y="336" width="240" height="58" rx="9"/>
        <text class="gate-t" x="480" y="360" text-anchor="middle">GATE 1 — plan approval</text>
        <text class="bx-s" x="480" y="379" text-anchor="middle">no code changes up to here</text>
        <!-- S5 -->
        <rect class="bx" x="360" y="424" width="240" height="58" rx="9"/>
        <rect class="bx-bar" x="360" y="438" width="3" height="30"/>
        <text class="bx-t mono-t" x="480" y="448" text-anchor="middle">phase-claim.sh</text>
        <text class="bx-s" x="480" y="467" text-anchor="middle">atomic number · worktree · branch</text>
        <!-- S6 -->
        <rect class="bx" x="360" y="512" width="240" height="58" rx="9"/>
        <rect class="bx-bar" x="360" y="526" width="3" height="30"/>
        <text class="bx-t" x="480" y="536" text-anchor="middle">Delegate — run-delegation.sh</text>
        <text class="bx-s" x="480" y="555" text-anchor="middle">standard·large go via task-orchestrator</text>
        <!-- S7 -->
        <rect class="bx" x="360" y="600" width="240" height="58" rx="9"/>
        <rect class="bx-bar" x="360" y="614" width="3" height="30"/>
        <text class="bx-t" x="480" y="624" text-anchor="middle">Domain review</text>
        <text class="bx-s" x="480" y="643" text-anchor="middle">ECC reviewers · codex-review.sh</text>
        <!-- S8 GATE2 -->
        <rect class="gate-bx" x="360" y="688" width="240" height="58" rx="9"/>
        <text class="gate-t" x="480" y="712" text-anchor="middle">GATE 2 — integration approval</text>
        <text class="bx-s" x="480" y="731" text-anchor="middle">batch-review phase results</text>
        <!-- S9 -->
        <rect class="bx" x="360" y="776" width="240" height="58" rx="9"/>
        <rect class="bx-bar" x="360" y="790" width="3" height="30"/>
        <text class="bx-t" x="480" y="800" text-anchor="middle">Report · phase-close.sh</text>
        <text class="bx-s" x="480" y="819" text-anchor="middle">summary report · phase end</text>
        <!-- S10 optional -->
        <rect class="opt-bx" x="360" y="864" width="240" height="58" rx="9"/>
        <text class="bx-t" x="480" y="888" text-anchor="middle">(optional) docker-ops apply</text>
        <text class="bx-s" x="480" y="907" text-anchor="middle">manifest tier · separate approval gate</text>

        <!-- spine arrows -->
        <line class="fl" x1="480" y1="132" x2="480" y2="157" marker-end="url(#ah)"/>
        <line class="fl" x1="480" y1="220" x2="480" y2="245" marker-end="url(#ah)"/>
        <line class="fl" x1="480" y1="308" x2="480" y2="333" marker-end="url(#ah)"/>
        <line class="fl" x1="480" y1="396" x2="480" y2="421" marker-end="url(#ah)"/>
        <line class="fl" x1="480" y1="484" x2="480" y2="509" marker-end="url(#ah)"/>
        <line class="fl" x1="480" y1="658" x2="480" y2="685" marker-end="url(#ah)"/>
        <line class="fl" x1="480" y1="748" x2="480" y2="773" marker-end="url(#ah)"/>
        <line class="fl" x1="480" y1="836" x2="480" y2="861" marker-end="url(#ah)"/>

        <!-- ===== user lane ===== -->
        <rect class="pill" x="55" y="72" width="190" height="58" rx="12"/>
        <text class="bx-t mono-t" x="150" y="96" text-anchor="middle" style="font-size:12px">cd project &amp;&amp; claude</text>
        <text class="bx-s" x="150" y="115" text-anchor="middle">Task request — one line of natural language</text>
        <line class="fl" x1="247" y1="101" x2="355" y2="101" marker-end="url(#ah)"/>

        <rect class="pill" x="55" y="160" width="190" height="58" rx="12"/>
        <text class="bx-t" x="150" y="184" text-anchor="middle" style="font-size:13px">Answer via choices</text>
        <text class="bx-s" x="150" y="203" text-anchor="middle">AskUserQuestion — one tap</text>
        <line class="fl" x1="249" y1="189" x2="356" y2="189" marker-start="url(#ah)" marker-end="url(#ah)"/>

        <rect class="pill" x="55" y="336" width="190" height="58" rx="12"/>
        <text class="bx-t" x="150" y="360" text-anchor="middle" style="font-size:13px">Approve plan</text>
        <text class="bx-s" x="150" y="379" text-anchor="middle">or request changes</text>
        <line class="fl" x1="249" y1="365" x2="356" y2="365" marker-start="url(#ah)" marker-end="url(#ah)"/>

        <rect class="pill" x="55" y="688" width="190" height="58" rx="12"/>
        <text class="bx-t" x="150" y="712" text-anchor="middle" style="font-size:13px">Approve integration</text>
        <text class="bx-s" x="150" y="731" text-anchor="middle">Decide phase end</text>
        <line class="fl" x1="249" y1="717" x2="356" y2="717" marker-start="url(#ah)" marker-end="url(#ah)"/>

        <rect class="pill" x="55" y="776" width="190" height="58" rx="12"/>
        <text class="bx-t" x="150" y="800" text-anchor="middle" style="font-size:13px">Receive result report</text>
        <text class="bx-s" x="150" y="819" text-anchor="middle">next task: new session recommended</text>
        <line class="fl" x1="356" y1="805" x2="249" y2="805" marker-end="url(#ah)"/>

        <!-- ===== opencode lane ===== -->
        <rect class="oc-bx" x="700" y="512" width="220" height="58" rx="9"/>
        <text class="bx-t" x="810" y="536" text-anchor="middle">Agent TDD implementation</text>
        <text class="bx-s" x="810" y="555" text-anchor="middle">tests first → implement → verify green</text>

        <!-- delegation -->
        <text class="lbl mono-t" x="650" y="526" text-anchor="middle">opencode run</text>
        <text class="lbl mono-t" x="650" y="540" text-anchor="middle">--agent &lt;name&gt;</text>
        <line class="fl" x1="602" y1="550" x2="697" y2="550" marker-end="url(#ah)"/>

        <!-- result back to review -->
        <polyline class="fl" points="760,572 760,624 606,624" marker-end="url(#ah)"/>
        <text class="lbl" x="688" y="614" text-anchor="middle">diff · test results</text>

        <!-- reject loop -->
        <polyline class="fl-a" points="604,645 840,645 840,574" marker-end="url(#ah-a)"/>
        <text class="lbl-a" x="722" y="661" text-anchor="middle">rejected → re-delegate at heavy tier</text>

        <!-- task loop: review pass -> next task -->
        <polyline class="fl" points="358,643 332,643 332,527 355,527" marker-end="url(#ah)"/>
        <text class="lbl" x="324" y="589" text-anchor="end">next task ↺</text>

        <!-- part boundary (session handoff point) -->
        <line class="fl-b" x1="320" y1="673" x2="640" y2="673"/>
        <text class="lbl" x="312" y="668" text-anchor="end">long phase: part boundary = session boundary</text>
        <text class="lbl" x="312" y="682" text-anchor="end">HANDOFF → resume in new session</text>

        <!-- guardrails note -->
        <rect class="opt-bx" x="662" y="690" width="286" height="86" rx="9"/>
        <text class="note-t" x="805" y="712" text-anchor="middle">Delegation guardrails</text>
        <text class="note-l" x="805" y="732" text-anchor="middle">permission guard — blocks commit·push·docker·sudo</text>
        <text class="note-l" x="805" y="748" text-anchor="middle">model fallback — model-policy chain, verify MODEL_USED</text>
        <text class="note-l" x="805" y="764" text-anchor="middle">global lock — serialize concurrent delegations</text>
      </svg>