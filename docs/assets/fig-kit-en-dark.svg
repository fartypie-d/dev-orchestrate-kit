<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
           aria-label="aigsprac v2 structure. The repo has three layers: core (harness-agnostic scripts, opencode config, onboarding, project template), adapters (claude · codex), and containers (browser — submodule). install.sh installs the global layer (~/.claude or ~/.codex, ~/.config/opencode), while new-project.sh and adopt-project.sh install the project scaffold."><style>
svg { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: #93A0AC; }
.lane-h { font-size: 13px; font-weight: 700; fill: #E5EAEF; letter-spacing: 0.02em; }
.lane-g { stroke: currentColor; stroke-dasharray: 3 6; opacity: 0.28; }
.bx { fill: #1A212A; stroke: #2D3743; stroke-width: 1.2; }
.bx-bar { fill: #56C2D4; }
.bx-t { font-size: 14px; font-weight: 650; fill: #E5EAEF; }
.bx-s { font-size: 11px; fill: #93A0AC; }
.gate-bx { fill: #2B2313; stroke: #E0A94E; stroke-width: 1.3; }
.gate-t { font-size: 14px; font-weight: 700; fill: #E0A94E; }
.pill { fill: #222B35; stroke: #2D3743; stroke-width: 1; }
.oc-bx { fill: #1A212A; stroke: #56C2D4; stroke-width: 1.5; }
.opt-bx { fill: none; stroke: #2D3743; stroke-width: 1.2; stroke-dasharray: 5 4; }
.fl { stroke: currentColor; stroke-width: 1.4; fill: none; }
.fl-a { stroke: #56C2D4; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.lbl { font-size: 11px; fill: #93A0AC; }
.lbl-a { font-size: 11px; fill: #56C2D4; font-weight: 600; }
.note-t { font-size: 11.5px; font-weight: 700; fill: #E5EAEF; }
.note-l { font-size: 11px; fill: #93A0AC; }
.mono-t { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.chip { fill: #1A212A; stroke: #2D3743; stroke-width: 1; }
.chip-g { fill: #2B2313; stroke: #E0A94E; stroke-width: 1.2; }
.chip-h { fill: #16333A; stroke: #56C2D4; stroke-width: 1.2; stroke-dasharray: 4 3; }
.chip-t { font-size: 11.5px; font-weight: 600; fill: #E5EAEF; }
.sess-bx { fill: #12171E; stroke: #2D3743; stroke-width: 1.2; }
.sess-t { font-size: 12px; font-weight: 700; fill: #E5EAEF; }
.fl-b { stroke: currentColor; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; opacity: 0.7; }
</style><rect width="100%" height="100%" fill="#1A212A"/>
        <defs>
          <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
        </defs>

        <rect class="oc-bx" x="290" y="20" width="320" height="52" rx="10"/>
        <text class="bx-t mono-t" x="450" y="42" text-anchor="middle">aigsprac</text>
        <text class="bx-s" x="450" y="60" text-anchor="middle">github.com/fartypie-d/aigsprac — single source across machines</text>

        <line class="fl" x1="450" y1="74" x2="450" y2="96" marker-end="url(#ah2)"/>

        <!-- repo layers -->
        <rect class="opt-bx" x="120" y="100" width="660" height="66" rx="10"/>
        <rect class="chip" x="140" y="116" width="200" height="34" rx="8"/>
        <text class="chip-t mono-t" x="240" y="131" text-anchor="middle">core/ — harness-agnostic</text>
        <text class="bx-s" x="240" y="144" text-anchor="middle">scripts · opencode · onboard · template</text>
        <rect class="chip" x="352" y="116" width="196" height="34" rx="8"/>
        <text class="chip-t mono-t" x="450" y="131" text-anchor="middle">adapters/ — per-harness</text>
        <text class="bx-s" x="450" y="144" text-anchor="middle">claude · codex</text>
        <rect class="chip" x="560" y="116" width="200" height="34" rx="8"/>
        <text class="chip-t mono-t" x="660" y="131" text-anchor="middle">containers/ — optional</text>
        <text class="bx-s" x="660" y="144" text-anchor="middle">browser(CDP) — submodule</text>

        <polyline class="fl" points="240,168 240,196" marker-end="url(#ah2)"/>
        <text class="lbl mono-t" x="252" y="186" text-anchor="start">./install.sh --claude|--codex --plan=… — global, once · idempotent</text>
        <polyline class="fl" points="660,168 660,196" marker-end="url(#ah2)"/>
        <text class="lbl mono-t" x="648" y="186" text-anchor="end">new-project.sh · adopt-project.sh — never overwrites</text>

        <!-- global panel -->
        <rect class="bx" x="40" y="200" width="390" height="240" rx="10"/>
        <rect class="bx-bar" x="40" y="218" width="3" height="34"/>
        <text class="bx-t" x="64" y="230">Global layer</text>
        <text class="bx-s" x="64" y="249">~/.claude or ~/.codex · ~/.config/opencode</text>
        <text class="note-l mono-t" x="64" y="282">skills/orchestrate or ~/.codex/prompts</text>
        <text class="note-l mono-t" x="64" y="306">opencode.json — provider registration</text>
        <text class="note-l mono-t" x="64" y="330">model-policy.json ← generated by gen-policy.sh</text>
        <text class="note-l mono-t" x="64" y="354">model-doctor.sh — live chain verification</text>
        <text class="note-l mono-t" x="64" y="378">ECC rules · reviewers + superpowers</text>
        <text class="note-l mono-t" x="64" y="402">plan profiles — pro · max5 · max20</text>
        <text class="note-l mono-t" x="64" y="426">secrets.env.example (real values per machine)</text>

        <!-- project panel -->
        <rect class="bx" x="470" y="200" width="390" height="240" rx="10"/>
        <rect class="bx-bar" x="470" y="218" width="3" height="34"/>
        <text class="bx-t" x="494" y="230">Project scaffold</text>
        <text class="bx-s" x="494" y="249">&lt;project&gt;/ — /orchestrate-onboard fills [TODO]</text>
        <text class="note-l mono-t" x="494" y="282">.claude/orchestrate.md — roster (shared by both harnesses)</text>
        <text class="note-l mono-t" x="494" y="306">.claude/hooks·settings or .codex/</text>
        <text class="note-l mono-t" x="494" y="330">.opencode/agent/*.md — built-in permission guards</text>
        <text class="note-l mono-t" x="494" y="354">scripts/run-delegation.sh — delegation runner</text>
        <text class="note-l mono-t" x="494" y="378">scripts/phase-claim · close · janitor</text>
        <text class="note-l mono-t" x="494" y="402">task-templates · docs/phases doc system</text>
        <text class="note-l mono-t" x="494" y="426">codex-review.sh (when using codex)</text>
      </svg>
