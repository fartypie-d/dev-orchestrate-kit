<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"
           aria-label="한 페이즈가 두 세션(파트)으로 나뉘는 구조. 세션 1은 인터뷰·지시서·GATE 1과 task 1~3을 수행하고 HANDOFF.md를 쓰고 끝난다. 세션 2는 HANDOFF와 현재 task 파일만 읽고 task 4~5, GATE 2, 보고·phase-close를 수행한다. 페이즈 번호·워크트리·브랜치·지시서는 하나로 유지된다."><style>
svg { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: #5D6873; }
.lane-h { font-size: 13px; font-weight: 700; fill: #212831; letter-spacing: 0.02em; }
.lane-g { stroke: currentColor; stroke-dasharray: 3 6; opacity: 0.28; }
.bx { fill: #FFFFFF; stroke: #D7DDE3; stroke-width: 1.2; }
.bx-bar { fill: #0B7285; }
.bx-t { font-size: 14px; font-weight: 650; fill: #212831; }
.bx-s { font-size: 11px; fill: #5D6873; }
.gate-bx { fill: #F8EFDC; stroke: #A26A00; stroke-width: 1.3; }
.gate-t { font-size: 14px; font-weight: 700; fill: #A26A00; }
.pill { fill: #EBEFF2; stroke: #D7DDE3; stroke-width: 1; }
.oc-bx { fill: #FFFFFF; stroke: #0B7285; stroke-width: 1.5; }
.opt-bx { fill: none; stroke: #D7DDE3; stroke-width: 1.2; stroke-dasharray: 5 4; }
.fl { stroke: currentColor; stroke-width: 1.4; fill: none; }
.fl-a { stroke: #0B7285; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.lbl { font-size: 11px; fill: #5D6873; }
.lbl-a { font-size: 11px; fill: #0B7285; font-weight: 600; }
.note-t { font-size: 11.5px; font-weight: 700; fill: #212831; }
.note-l { font-size: 11px; fill: #5D6873; }
.mono-t { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.chip { fill: #FFFFFF; stroke: #D7DDE3; stroke-width: 1; }
.chip-g { fill: #F8EFDC; stroke: #A26A00; stroke-width: 1.2; }
.chip-h { fill: #E3F0F2; stroke: #0B7285; stroke-width: 1.2; stroke-dasharray: 4 3; }
.chip-t { font-size: 11.5px; font-weight: 600; fill: #212831; }
.sess-bx { fill: #F4F6F8; stroke: #D7DDE3; stroke-width: 1.2; }
.sess-t { font-size: 12px; font-weight: 700; fill: #212831; }
.fl-b { stroke: currentColor; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; opacity: 0.7; }
</style><rect width="100%" height="100%" fill="#FFFFFF"/>
        <defs>
          <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
        </defs>

        <rect class="opt-bx" x="25" y="45" width="860" height="205" rx="12"/>
        <text class="note-t" x="45" y="72">PHASE N — 번호·워크트리·브랜치·지시서는 끝까지 하나</text>

        <!-- session 1 -->
        <rect class="sess-bx" x="45" y="88" width="395" height="140" rx="10"/>
        <text class="sess-t" x="65" y="112">세션 1 = 파트 N-1</text>
        <rect class="chip" x="65" y="126" width="130" height="30" rx="7"/>
        <text class="chip-t" x="130" y="145" text-anchor="middle">인터뷰 · 지시서</text>
        <rect class="chip-g" x="205" y="126" width="70" height="30" rx="7"/>
        <text class="chip-t" x="240" y="145" text-anchor="middle">GATE 1</text>
        <rect class="chip" x="285" y="126" width="64" height="30" rx="7"/>
        <text class="chip-t" x="317" y="145" text-anchor="middle">task 1</text>
        <rect class="chip" x="65" y="176" width="64" height="30" rx="7"/>
        <text class="chip-t" x="97" y="195" text-anchor="middle">task 2</text>
        <rect class="chip" x="139" y="176" width="64" height="30" rx="7"/>
        <text class="chip-t" x="171" y="195" text-anchor="middle">task 3</text>
        <rect class="chip-h" x="213" y="176" width="150" height="30" rx="7"/>
        <text class="chip-t" x="288" y="195" text-anchor="middle">HANDOFF.md 작성</text>

        <!-- session switch -->
        <line class="fl" x1="442" y1="158" x2="477" y2="158" marker-end="url(#ah3)"/>
        <text class="lbl" x="459" y="147" text-anchor="middle">새 세션</text>

        <!-- session 2 -->
        <rect class="sess-bx" x="480" y="88" width="390" height="140" rx="10"/>
        <text class="sess-t" x="500" y="112">세션 2 = 파트 N-2</text>
        <rect class="chip-h" x="500" y="126" width="190" height="30" rx="7"/>
        <text class="chip-t" x="595" y="145" text-anchor="middle">HANDOFF·task 파일만 읽기</text>
        <rect class="chip" x="700" y="126" width="64" height="30" rx="7"/>
        <text class="chip-t" x="732" y="145" text-anchor="middle">task 4</text>
        <rect class="chip" x="500" y="176" width="64" height="30" rx="7"/>
        <text class="chip-t" x="532" y="195" text-anchor="middle">task 5</text>
        <rect class="chip-g" x="574" y="176" width="70" height="30" rx="7"/>
        <text class="chip-t" x="609" y="195" text-anchor="middle">GATE 2</text>
        <rect class="chip" x="654" y="176" width="150" height="30" rx="7"/>
        <text class="chip-t" x="729" y="195" text-anchor="middle">보고 · phase-close</text>

        <text class="lbl" x="455" y="282" text-anchor="middle">파트 경계 = 세션 경계 = HANDOFF 시점 — 인계는 임기응변이 아니라 지시서 작성 시점에 계획한다</text>
      </svg>